name: Issue Lifecycle Sync

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sync:
    uses: Plimmerton-Labs/engineering-automation/.github/workflows/reusable-issue-lifecycle-sync.yml@v1.0.0
