name: Promote develop to main

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raise-promotion-pr:
    name: Raise promotion PR
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      MAINTAINER_TEAM_SLUG: maintainers
    steps:
      - name: Checkout develop
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop

      - name: Mint GitHub App token
        id: app-token
        env:
          GITHUB_APP_ID: ${{ secrets.PLIMMERTON_AI_AGENTS_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.PLIMMERTON_AI_AGENTS_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.PLIMMERTON_AI_AGENTS_PRIVATE_KEY }}
        run: |
          token="$(node scripts/github-app-token.mjs)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Create or update promotion PR
        env:
          PLIMMERTON_AI_AGENT_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          api() {
            local method="$1"
            local path="$2"
            local data="${3:-}"

            if [ -n "$data" ]; then
              curl -sS --fail-with-body \
                --request "$method" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${PLIMMERTON_AI_AGENT_TOKEN}" \
                --header "Content-Type: application/json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data "$data" \
                "https://api.github.com${path}"
            else
              curl -sS --fail-with-body \
                --request "$method" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${PLIMMERTON_AI_AGENT_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com${path}"
            fi
          }

          comparison="$(api GET "/repos/${REPO}/compare/main...develop")"
          ahead_by="$(jq -r '.ahead_by' <<< "$comparison")"
          if [ "$ahead_by" = "0" ]; then
            echo "develop has no commits ahead of main; no promotion PR needed."
            exit 0
          fi

          existing="$(api GET "/repos/${REPO}/pulls?state=open&head=Plimmerton-Labs:develop&base=main")"
          pr_number="$(jq -r '.[0].number // empty' <<< "$existing")"
          pr_url="$(jq -r '.[0].html_url // empty' <<< "$existing")"

          body_text="$(node scripts/render-promotion-pr-body.mjs <<< "$comparison")"

          body="$(jq -n \
            --arg title "Promote develop to main" \
            --arg head "develop" \
            --arg base "main" \
            --arg body "$body_text" \
            '{title: $title, head: $head, base: $base, body: $body, draft: false}')"

          if [ -z "$pr_number" ]; then
            created="$(api POST "/repos/${REPO}/pulls" "$body")"
            pr_number="$(jq -r '.number' <<< "$created")"
            pr_url="$(jq -r '.html_url' <<< "$created")"
          fi

          echo "Promotion PR: ${pr_url}"

          review_payload="$(jq -n --arg team "$MAINTAINER_TEAM_SLUG" '{team_reviewers: [$team]}')"
          if ! api POST "/repos/${REPO}/pulls/${pr_number}/requested_reviewers" "$review_payload"; then
            comment_payload="$(jq -n \
              --arg body "Could not request review from @Plimmerton-Labs/${MAINTAINER_TEAM_SLUG} using the GitHub App identity. Check that the App installation has repository Pull requests: write permission and organisation Members: read permission; without Members: read, GitHub can fail to resolve an existing team slug. A human maintainer should route this promotion PR to the correct maintainer team." \
              '{body: $body}')"
            api POST "/repos/${REPO}/issues/${pr_number}/comments" "$comment_payload"
          fi
