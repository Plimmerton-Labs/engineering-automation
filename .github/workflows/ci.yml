name: Repository Hygiene

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  required-files:
    name: Required repository files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install registration tooling dependencies
        run: npm ci

      - name: Check required governance files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .github/CODEOWNERS
          test -f .github/labels.json
          test -f .github/pull_request_template.md
          test -f docs/decisions/template.md
          test -f docs/repository-setup.md
          test -f plimmerton-project.yml
          test -f docs/research/README.md
          test -f docs/design/README.md
          test -f docs/learnings.md

      - name: Verify label taxonomy tooling
        run: npm test
